# Roda o radar de notícias toda segunda-feira às 8h (horário de Brasília):
# coleta os feeds, pede ao Claude a copy das melhores notícias e envia as
# sugestões ao painel /blog/admin/noticias como "pendente".
# Nada é publicado automaticamente: só aparece no site o que marketing aprovar no painel.
name: Radar semanal de notícias

on:
  schedule:
    - cron: '0 11 * * 1'   # 11:00 UTC = 08:00 BRT
  workflow_dispatch: {}     # permite rodar manualmente pela aba Actions

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Coletar, escrever a copy e enviar ao painel
        run: npm run radar:semanal
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Endereço da API (ex.: https://api.blog.citi.org.br) e o mesmo RADAR_TOKEN cadastrado no Coolify.
          API_URL: ${{ secrets.API_URL }}
          RADAR_TOKEN: ${{ secrets.RADAR_TOKEN }}

      # Relatório completo e prévia da copy ficam guardados 30 dias na execução.
      - name: Guardar relatório e prévia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-semanal
          path: |
            radar/relatorios/
            radar/sugestoes/
          retention-days: 30
